name: Byg Android AAB

on:
  workflow_dispatch:   # Manuel start via Actions-fanen på GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer dependencies
        run: npm ci

      - name: Byg web-app
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tjek Meta-nøgler
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          # Mangler nøglerne, bygger gradle alligevel en AAB — den måler bare
          # ingenting, og det opdages først uger senere i Events Manager.
          # Derfor stoppes buildet her i stedet.
          #
          # Værdierne vises ikke. Der siges kun, om de er sat.
          if [ -z "$FACEBOOK_APP_ID" ] || [ -z "$FACEBOOK_CLIENT_TOKEN" ]; then
            echo "FEJL: FACEBOOK_APP_ID og/eller FACEBOOK_CLIENT_TOKEN mangler i GitHub Secrets." >&2
            exit 1
          fi
          case "$FACEBOOK_APP_ID" in
            ''|*[!0-9]*)
              echo "FEJL: FACEBOOK_APP_ID skal kun bestå af cifre. Er app-id og client token byttet om?" >&2
              exit 1
              ;;
          esac
          echo "Meta-nøglerne er sat. Værdierne vises ikke."

      - name: Byg release AAB
        working-directory: android
        env:
          # Metas app-id og client token. Læses af resValue i
          # app/build.gradle, så de ikke behøver stå i repoet.
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Signér AAB
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          jarsigner -keystore upload-keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -signedjar app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab upload
          rm upload-keystore.jks

      - name: Upload AAB som artifact
        uses: actions/upload-artifact@v4
        with:
          name: club-no-sleep-release
          path: app-release-signed.aab
